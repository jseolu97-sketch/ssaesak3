// ---------- 작은 도우미들 ----------
const pad = (n) => String(n).padStart(2, '0');
// 로컬(한국) 날짜 기준. toISOString은 UTC라 아침엔 어제 날짜가 됨
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => toDateStr(new Date());
const daysAgoStr = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return toDateStr(d); };
const parseDay = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

function calculateWaterStatus(lastWatered, intervalDays, now = new Date()) {
    if (!lastWatered) return { daysLeft: 0, statusText: '물 줄 시간!', colorClass: 'bg-rose-500 text-white' };
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffDays = Math.round((today - parseDay(lastWatered)) / 86400000);
    const daysLeft = Number(intervalDays) - diffDays;
    if (daysLeft < 0) return { daysLeft, statusText: `물주기 ${-daysLeft}일 지남! 💦`, colorClass: 'bg-red-500 text-white animate-pulse' };
    if (daysLeft === 0) return { daysLeft, statusText: '오늘 물주는 날! 💧', colorClass: 'bg-amber-500 text-white font-black' };
    if (daysLeft === 1) return { daysLeft, statusText: '내일 물주는 날! 🌤️', colorClass: 'bg-blue-500 text-white' };
    return { daysLeft, statusText: `${daysLeft}일 뒤 물주기`, colorClass: 'bg-emerald-100 text-emerald-800' };
}
// self-check
console.assert(calculateWaterStatus('2026-10-21', 7, new Date(2026, 9, 28, 8)).daysLeft === 0, 'water today');

// 사진을 600px JPEG로 줄임: localStorage 용량(약 5MB) 초과 방지 + AI 전송용
function shrinkPhoto(file, max = 600) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const s = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
        img.src = url;
    });
}
const storage = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

// ---------- AI: 우리 서버(/api/ai)가 Gemini를 대신 불러 줌 ----------
async function callAI(payload) {
    let r;
    try {
        r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } catch { throw { code: 'network' }; }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: data.error || 'upstream' };
    return data;
}

// WMO 날씨 코드 → 어린이용 이름
function weatherLabel(code) {
    if (code === 0) return '☀️ 맑음';
    if (code <= 2) return '🌤️ 구름 조금';
    if (code === 3) return '☁️ 흐림';
    if (code <= 48) return '🌫️ 안개';
    if (code <= 57) return '🌦️ 이슬비';
    if (code <= 67 || (code >= 80 && code <= 82)) return '🌧️ 비';
    if (code <= 77 || code === 85 || code === 86) return '❄️ 눈';
    if (code >= 95) return '⛈️ 천둥번개';
    return '🌥️ 흐림';
}

// 배포된 사이트에서는 우리 서버(/api/weather)를 거쳐 받는다. 날씨 사이트가 막힌 학교 인터넷에서도 동작하게.
// 컴퓨터에서 파일을 바로 열었을 때(file://)는 서버가 없으니 Open-Meteo에 직접 접속한다.
const VIA_SERVER = location.protocol !== 'file:';
async function getJson(serverPath, directUrl) {
    const r = await fetch(VIA_SERVER ? serverPath : directUrl);
    if (!r.ok) throw new Error(r.status === 404 && VIA_SERVER ? '날씨 서버 함수가 없어요 (api/weather.js 배포 확인)' : `날씨 서버 오류 ${r.status}`);
    return r.json();
}

async function fetchWeather(lat, lon) {
    const d = await getJson(`/api/weather?lat=${lat}&lon=${lon}`,
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        + '&current=temperature_2m,relative_humidity_2m,weather_code'
        + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max'
        + '&timezone=Asia%2FSeoul&forecast_days=1');
    return {
        temp: Math.round(d.current.temperature_2m),
        humidity: Math.round(d.current.relative_humidity_2m),
        code: d.current.weather_code,
        tmax: Math.round(d.daily.temperature_2m_max[0]),
        tmin: Math.round(d.daily.temperature_2m_min[0]),
        rainProb: d.daily.precipitation_probability_max?.[0] ?? 0,
        uv: Math.round(d.daily.uv_index_max?.[0] ?? 0),
        time: d.current.time,
    };
}

async function searchPlace(query) {
    const q = query.trim().replace(/(특별시|광역시|특별자치시|특별자치도|시|군|구)$/, '') || query.trim();
    const local = KR_CITIES.find(c => c.name === q || q.includes(c.name));
    if (local) return local;
    const item = (await getJson(`/api/weather?q=${encodeURIComponent(q)}`,
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ko&countryCode=KR`)).results?.[0];
    if (!item) return null;
    return { id: `geo_${item.id}`, name: item.admin1 && item.admin1 !== item.name ? `${item.name} (${item.admin1})` : item.name, lat: item.latitude, lon: item.longitude };
}

// 날씨에 맞춘 식물 돌보기 팁 (여러 개가 동시에 맞을 수 있음)
function weatherCare(w) {
    const tips = [];
    const snowy = (w.code >= 71 && w.code <= 77) || w.code === 85 || w.code === 86;
    const rainy = !snowy && ((w.code >= 51 && w.code <= 67) || (w.code >= 80 && w.code <= 82) || w.code >= 95);
    if (w.tmin <= 0) tips.push({ icon: '🧊', text: `밤에 ${w.tmin}°C까지 내려가 얼 수 있어요! 베란다·바깥 화분은 꼭 방 안으로 들여 주세요.` });
    else if (w.tmin <= 7) tips.push({ icon: '🥶', text: `밤에 ${w.tmin}°C까지 쌀쌀해요. 추위를 타는 식물(몬스테라, 고무나무)은 창가에서 조금 떨어뜨려 주세요.` });
    if (w.tmax >= 30) tips.push({ icon: '🔥', text: `낮 최고 ${w.tmax}°C! 한낮엔 화분을 그늘로 옮기고, 아침이나 저녁에 물을 주세요.` });
    if (snowy) tips.push({ icon: '❄️', text: '눈이 와요! 찬 공기가 들어오지 않게 창문을 닫고, 물은 미지근하게 주세요.' });
    if (rainy || w.rainProb >= 60) tips.push({ icon: '🌧️', text: `비 소식이 있어요 (비 올 확률 ${w.rainProb}%). 바깥 화분은 오늘 물주기를 쉬고, 실내 화분은 흙을 만져 보고 주세요.` });
    if (w.humidity >= 85) tips.push({ icon: '💧', text: `습도가 ${w.humidity}%로 높아요. 곰팡이가 생기지 않게 창문을 열어 바람을 쐬어 주세요.` });
    else if (w.humidity <= 35) tips.push({ icon: '🌬️', text: `공기가 건조해요 (습도 ${w.humidity}%). 분무기로 잎에 물을 살짝 뿌려 주세요.` });
    if (w.uv >= 8 && !rainy) tips.push({ icon: '🕶️', text: '햇볕이 아주 강해요. 여린 잎은 커튼으로 햇빛을 살짝 가려 주세요.' });
    if (!tips.length) tips.push({ icon: '🌿', text: '식물이 지내기 딱 좋은 날씨예요! 햇볕을 쬐어 주고, 흙이 말랐는지 손가락으로 만져 보세요.' });
    return tips;
}
// self-check
console.assert(weatherCare({ code: 63, rainProb: 90, tmin: 12, tmax: 18, humidity: 70, uv: 2 }).some(t => t.icon === '🌧️'), 'rain tip');
console.assert(weatherCare({ code: 0, rainProb: 0, tmin: -3, tmax: 4, humidity: 50, uv: 2 })[0].icon === '🧊', 'freeze tip');
console.assert(weatherCare({ code: 1, rainProb: 10, tmin: 15, tmax: 24, humidity: 55, uv: 4 })[0].icon === '🌿', 'nice day');

function PlantPic({ plant, className }) {

}

function App() {
    const [activeTab, setActiveTab] = useState('garden');
    const [myPlants, setMyPlants] = useState(() => storage.get('kids_my_plants', null) || samplePlants());
    const [toastMessage, setToastMessage] = useState('');
    const toastTimer = useRef(null);
    const showToast = (msg) => {
        setToastMessage(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToastMessage(''), 3500);
    };

    useEffect(() => {
        if (!storage.set('kids_my_plants', myPlants)) showToast('💾 저장 공간이 꽉 찼어요. 사진이 있는 식물을 몇 개 지워 주세요.');
    }, [myPlants]);

    const askJson = async (task, image) => (await callAI({ task, image })).result;

    // ---------- 지역 날씨 ----------
    const [city, setCity] = useState(() => storage.get('kids_city', KR_CITIES[0]));
    const [weather, setWeather] = useState(null);
    const [weatherState, setWeatherState] = useState('loading'); // loading | ok | error
    const [weatherErr, setWeatherErr] = useState('');
    const [cityInput, setCityInput] = useState('');
    const season = currentSeason();

    const loadWeather = async (c) => {
        setWeatherState('loading');
        try {
            setWeather(await fetchWeather(c.lat, c.lon));
            setCity(c);
            storage.set('kids_city', c);
            setWeatherState('ok');
        } catch (e) {
            console.error('weather failed', e);
            setWeatherErr(e instanceof TypeError ? '날씨 서버에 연결하지 못했어요 (인터넷·보안 프로그램 확인)' : String(e.message || e));
            setCity(c);
            setWeatherState('error');
        }
    };
    useEffect(() => { loadWeather(city); }, []);

    const handleSearchCity = async (e) => {
        e.preventDefault();
        const q = cityInput.trim();
        if (!q) return showToast('🔎 지역 이름을 적어 주세요! (예: 아산, 태안, 제주)');
        try {
            const found = await searchPlace(q);
            if (!found) return showToast(`🤔 '${q}'을(를) 찾지 못했어요. 시나 군 이름으로 적어 보세요.`);

            await loadWeather(found);
            showToast(`📍 '${found.name}' 날씨를 불러왔어요!`);

        }
    };

    const useMyLocation = () => {
        if (!navigator.geolocation) return showToast('📍 이 기기에서는 위치를 쓸 수 없어요.');
        navigator.geolocation.getCurrentPosition(
            (pos) => loadWeather({ id: 'here', name: '내 위치', lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3) }),
            () => showToast('📍 위치를 알 수 없어요. 지역 이름으로 검색해 주세요.'),
            { timeout: 10000 }
        );
    };

    const careTips = weatherState === 'ok' && weather ? weatherCare(weather) : [{ icon: '📅', text: season.tip }];
    const weatherSummary = weather && weatherState === 'ok'
        ? `${city.name} 날씨: ${weatherLabel(weather.code)}, 지금 ${weather.temp}°C, 최저 ${weather.tmin}°C/최고 ${weather.tmax}°C, 습도 ${weather.humidity}%, 비 올 확률 ${weather.rainProb}%`
        : `${season.name}`;

    // ---------- 식물 추가 모달 ----------
    const [showAddModal, setShowAddModal] = useState(false);
    const [newPlantData, setNewPlantData] = useState({ nickname: '', species: '', memo: '', waterIntervalDays: 7 });
    const [modalImagePreview, setModalImagePreview] = useState(null);
    const [isAnalyzingModalImage, setIsAnalyzingModalImage] = useState(false);
    const [analyzingCardId, setAnalyzingCardId] = useState(null);
    const [deleteTarget, setDeleteTarget] = useState(null);

    const openAddModal = () => {
        setShowAddModal(true);
        setModalImagePreview(null);
        setNewPlantData({ nickname: '', species: '', memo: '', waterIntervalDays: 7 });
    };

    const readPhoto = async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return null;
        try { return await shrinkPhoto(file); }
        catch { showToast('📷 사진을 열 수 없어요. JPG나 PNG 사진을 골라 주세요.'); return null; }
    };

    const autoAnalyzePlantImage = async (imgData, plantId = null) => {
        plantId ? setAnalyzingCardId(plantId) : setIsAnalyzingModalImage(true);
        try {
            const r = await askJson('autofill', imgData);
            const interval = Math.min(30, Math.max(1, parseInt(r.waterIntervalDays) || 7));
            if (plantId) {
                setMyPlants(prev => prev.map(p => p.id === plantId
                    ? { ...p, species: r.species || p.species, waterIntervalDays: interval, memo: r.memo || p.memo, sample: false }
                    : p));
            } else {
                setNewPlantData(prev => ({
                    ...prev,
                    species: r.species || prev.species,
                    nickname: prev.nickname || r.suggestedNickname || r.species || '',
                    memo: r.memo || prev.memo,
                    waterIntervalDays: interval,
                }));
            }
            showToast(`✨ AI 분석 완료: '${r.species}' (${interval}일마다 물주기)`);
        } catch (err) {
            showToast(aiErrorText(err));
        } finally {
            plantId ? setAnalyzingCardId(null) : setIsAnalyzingModalImage(false);
        }
    };

    const handleModalImageSelect = async (e) => {
        const img = await readPhoto(e);
        if (!img) return;
        setModalImagePreview(img);
        autoAnalyzePlantImage(img);
    };

    const handleExistingCardPhotoChange = async (e, plantId) => {
        const img = await readPhoto(e);
        if (!img) return;
        setMyPlants(prev => prev.map(p => p.id === plantId ? { ...p, image: img } : p));
        autoAnalyzePlantImage(img, plantId);
    };

    // ---------- 식물 이름 찾기 / 건강 진단 ----------
    const [identifyImage, setIdentifyImage] = useState(null);
    const [identifyResult, setIdentifyResult] = useState(null);
    const [isIdentifying, setIsIdentifying] = useState(false);
    const [diagnosisImage, setDiagnosisImage] = useState(null);
    const [diagnosisResult, setDiagnosisResult] = useState(null);
    const [isDiagnosing, setIsDiagnosing] = useState(false);

    const handleIdentifyUpload = async (e) => { const img = await readPhoto(e); if (img) { setIdentifyImage(img); setIdentifyResult(null); } };
    const handleDiagnosisUpload = async (e) => { const img = await readPhoto(e); if (img) { setDiagnosisImage(img); setDiagnosisResult(null); } };

    const runPlantIdentification = async () => {
        if (!identifyImage) return showToast('📸 식물 사진을 올려주세요!');
        setIsIdentifying(true);
        try { setIdentifyResult(await askJson('identify', identifyImage)); }
        catch (err) { showToast(aiErrorText(err)); }
        finally { setIsIdentifying(false); }
    };

    const runPlantDiagnosis = async () => {
        if (!diagnosisImage) return showToast('📷 화분이나 잎 사진을 올려주세요!');
        setIsDiagnosing(true);
        try { setDiagnosisResult(await askJson('diagnose', diagnosisImage)); }
        catch (err) { showToast(aiErrorText(err)); }
        finally { setIsDiagnosing(false); }
    };

    // ---------- 식물 박사에게 질문 (채팅) ----------
    const [chat, setChat] = useState([]);
    const [chatInput, setChatInput] = useState('');
    const [chatBusy, setChatBusy] = useState(false);

    const sendChat = async (e) => {
        e?.preventDefault();
        const q = chatInput.trim();
        if (!q || chatBusy) return;
        const plantsInfo = myPlants.map(p => `${p.nickname}(${p.species}, ${p.waterIntervalDays}일마다 물)`).join(', ');
        const history = [...chat, { role: 'user', content: q }].slice(-10);
        setChat([...history, { role: 'assistant', content: '' }]);
        setChatInput('');
        setChatBusy(true);
        try {
            const { text } = await callAI({ task: 'chat', messages: history, context: `키우는 식물: ${plantsInfo || '없음'}. 오늘 ${weatherSummary}` });
            setChat([...history, { role: 'assistant', content: text }]);
        } catch (err) {
            showToast(aiErrorText(err));
            setChat(chat); // 실패하면 보낸 질문을 입력창에 돌려줌
            setChatInput(q);
        } finally {
            setChatBusy(false);
        }
    };

    // ---------- 식물 관리 ----------
    const handleWaterPlant = (id) => {
        setMyPlants(prev => prev.map(p => p.id === id ? { ...p, lastWatered: todayStr() } : p));
        showToast(weatherState === 'ok' && weather.rainProb >= 60 ? '💦 물을 주었어요! 오늘은 비 소식이 있으니 바깥 화분은 조금만 줘도 돼요.' : '💦 시원하게 물을 주었어요! 식물이 기뻐해요!');
    };

    const confirmDeletePlant = () => {
        if (!deleteTarget) return;
        setMyPlants(prev => prev.filter(p => p.id !== deleteTarget.id));
        showToast(`🗑️ '${deleteTarget.nickname}' 식물이 식물밭에서 지워졌습니다.`);
        setDeleteTarget(null);
    };

    const handleAddIdentifiedToMyGarden = () => {
        if (!identifyResult) return;
        const newPlant = {
            id: Date.now().toString(),
            nickname: `${identifyResult.plantName}이 🌱`,
            species: identifyResult.plantName,
            registeredDate: todayStr(),
            lastWatered: todayStr(),
            waterIntervalDays: parseInt(identifyResult.waterIntervalDays) || 7,
            image: identifyImage,
            memo: identifyResult.funFact || '탐험대에서 직접 찾은 내 식물!',
        };
        setMyPlants(prev => [newPlant, ...prev]);
        showToast(`🎉 '${newPlant.nickname}' 식물이 내 식물밭에 새로 등록되었어요!`);
        setActiveTab('garden');
    };

    const handleSaveNewPlantModal = (e) => {
        e.preventDefault();
        if (!newPlantData.nickname.trim() || !newPlantData.species.trim()) return showToast('📌 식물 별명과 종류를 입력해 주세요!');
        const newPlant = {
            id: Date.now().toString(),
            nickname: newPlantData.nickname.trim(),
            species: newPlantData.species.trim(),
            registeredDate: todayStr(),
            lastWatered: todayStr(),
            waterIntervalDays: parseInt(newPlantData.waterIntervalDays) || 7,
            image: modalImagePreview,
            memo: newPlantData.memo || '사랑으로 키우는 내 식물!',
        };
        setMyPlants(prev => [newPlant, ...prev]);
        setShowAddModal(false);
        showToast(`🎉 '${newPlant.nickname}' 식물이 성공적으로 추가되었습니다!`);
    };

    const thirsty = myPlants.filter(p => calculateWaterStatus(p.lastWatered, p.waterIntervalDays).daysLeft <= 0);

    return (
        <div>
            <header className="text-center mb-8 bg-white p-6 md:p-8 rounded-3xl border-3 border-emerald-300 shadow-md">
                <h1 className="text-4xl md:text-5xl font-black text-emerald-800 font-gaegu flex items-center justify-center gap-3 flex-wrap">
                    <span>🌱</span> 새싹이의 식물 탐험대
                </h1>
                <p className="text-lg md:text-xl font-extrabold text-emerald-600 mt-2">
                    초등학생을 위한 AI 식물 도감 & 화분 의사 선생님 🪴
                </p>
            </header>

            {/* 지역 날씨 & 오늘의 식물 케어 */}
            <section className="mb-8 bg-amber-100 border-3 border-amber-300 p-4 md:p-6 rounded-3xl shadow-sm space-y-4">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div className="flex items-center gap-3.5 min-w-0">
                        <div className="w-14 h-14 bg-amber-200 rounded-2xl flex items-center justify-center text-3xl shrink-0" aria-hidden="true">
                            {weatherState === 'loading' ? <i className="fa-solid fa-spinner fa-spin text-amber-700 text-2xl"></i>
                                : weatherState === 'ok' ? weatherLabel(weather.code).split(' ')[0] : '🌱'}
                        </div>
                        <div className="min-w-0" aria-live="polite">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="bg-amber-300 text-amber-950 text-base md:text-lg font-black px-3 py-1 rounded-full">📍 {city.name}</span>
                                {weatherState === 'ok' && <>
                                    <span className="text-2xl md:text-3xl font-black text-amber-950 tabular-nums">{weather.temp}°C</span>
                                    <span className="text-xs md:text-sm font-bold text-amber-900 bg-amber-200 px-2.5 py-1 rounded-lg tabular-nums">💧 습도 {weather.humidity}%</span>
                                </>}
                            </div>
                            <p className="text-sm md:text-base font-extrabold text-amber-900 mt-1">
                                {weatherState === 'loading' && '날씨를 불러오고 있어요...'}

                                    날씨를 불러오지 못했어요. 대신 {season.name} 돌보기 팁을 보여 줄게요.
                                    <span className="block text-xs font-bold text-amber-700 mt-0.5">이유: {weatherErr}</span>
                                </>}
                                {weatherState === 'ok' && <>{weatherLabel(weather.code)} · <span className="tabular-nums">최저 {weather.tmin}° / 최고 {weather.tmax}°</span> · 비 올 확률 {weather.rainProb}%</>}
                            </p>
                        </div>
                    </div>
                    <form onSubmit={handleSearchCity} className="flex items-center gap-2 w-full md:w-auto">
                        <label htmlFor="city-input" className="sr-only">지역 이름</label>
                        <input id="city-input" type="text" placeholder="우리 동네 (예: 아산, 태안)" value={cityInput} maxLength={30}
                            onChange={(e) => setCityInput(e.target.value)}
                            className="flex-1 min-w-0 md:w-56 px-4 py-3 bg-white font-extrabold text-base rounded-2xl border-2 border-amber-300 focus:outline-none placeholder:text-slate-400" />
                        <button type="submit" disabled={weatherState === 'loading'} className="kid-btn px-4 py-3 bg-amber-500 hover:bg-amber-600 disabled:bg-amber-300 text-white font-black rounded-2xl shadow-md shrink-0">
                            <i className="fa-solid fa-magnifying-glass"></i> 검색
                        </button>
                    </form>
                </div>

                <div className="flex items-center gap-2 overflow-x-auto scrollbar-none pb-1 text-sm font-extrabold">
                    <button onClick={useMyLocation} className="shrink-0 px-3 py-1.5 rounded-full border-2 border-emerald-500 bg-emerald-500 text-white">📍 내 위치</button>
                    {KR_CITIES.slice(0, 12).map(c => (
                        <button key={c.id} onClick={() => loadWeather(c)} aria-pressed={city.id === c.id}
                            className={`shrink-0 px-3 py-1.5 rounded-full border-2 ${city.id === c.id ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-amber-900 border-amber-300 hover:bg-amber-50'}`}>
                            {c.name}
                        </button>
                    ))}
                </div>

                <div className="bg-white p-4 rounded-2xl border border-amber-300">
                    <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
                        <h2 className="font-black text-amber-950 text-lg">💡 오늘의 식물 케어</h2>
                        {thirsty.length > 0 && (
                            <button onClick={() => setActiveTab('garden')} className="kid-btn bg-blue-500 text-white font-black text-sm px-3 py-1.5 rounded-xl shadow">
                                💧 물이 필요한 친구 {thirsty.length}명
                            </button>
                        )}
                    </div>
                    <ul className="space-y-1.5">
                        {careTips.map((t, i) => (
                            <li key={i} className="flex gap-2 text-base md:text-lg font-bold text-slate-700">
                                <span aria-hidden="true">{t.icon}</span><span>{t.text}</span>
                            </li>
                        ))}
                    </ul>
                </div>
            </section>

            {/* 탭 */}
            <nav className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-8">
                {[
                    { id: 'garden', title: '🪴 내 식물밭', desc: '내가 키우는 식물', icon: 'fa-seedling' },
                    { id: 'identify', title: '📸 이름 찾기', desc: '사진으로 식물 찾기', icon: 'fa-camera-retro' },
                    { id: 'diagnosis', title: '🩺 건강 진단', desc: '아픈 잎 살펴보기', icon: 'fa-stethoscope' },
                    { id: 'ask', title: '🦉 식물 박사', desc: '궁금한 것 물어보기', icon: 'fa-comments' },
                    { id: 'weather', title: '🌤️ 날씨 상식', desc: '계절별 돌보기', icon: 'fa-cloud-sun' },
                ].map(tab => {
                    const active = activeTab === tab.id;
                    return (
                        <button key={tab.id} onClick={() => setActiveTab(tab.id)} aria-current={active ? 'page' : undefined}
                            className={`kid-btn p-4 rounded-2xl font-black text-left flex flex-col justify-between border-3 ${active ? 'bg-emerald-600 text-white border-emerald-700 shadow-lg' : 'bg-white text-slate-700 border-emerald-200 hover:border-emerald-400'} ${tab.id === 'weather' ? 'col-span-2 md:col-span-1' : ''}`}>
                            <i className={`fa-solid ${tab.icon} text-2xl mb-2 ${active ? 'text-yellow-300' : 'text-emerald-500'}`}></i>
                            <div>
                                <div className="text-lg font-extrabold leading-tight">{tab.title}</div>
                                <div className={`text-xs md:text-sm font-bold mt-1 ${active ? 'text-emerald-100' : 'text-slate-500'}`}>{tab.desc}</div>
                            </div>
                        </button>
                    );
                })}
            </nav>

            {/* 내 식물밭 */}
            {activeTab === 'garden' && (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-white p-5 rounded-2xl border-2 border-emerald-200 gap-4">
                        <div>
                            <h2 className="text-2xl md:text-3xl font-extrabold text-emerald-900">🪴 내 소중한 식물 친구들</h2>
                            <p className="text-base md:text-lg font-bold text-slate-600">
                                총 <span className="text-emerald-600 font-black">{myPlants.length}개</span>의 식물 친구가 함께 자라고 있어요!
                            </p>
                            <p className="text-xs font-bold text-slate-400 mt-1">기록은 이 기기의 브라우저에만 저장돼요.</p>
                        </div>
                        <button onClick={openAddModal} className="kid-btn px-6 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-2xl shadow-md flex items-center gap-2">
                            <i className="fa-solid fa-plus text-xl"></i><span>새 식물 등록하기</span>
                        </button>
                    </div>

                    {myPlants.length === 0 ? (
                        <div className="bg-white p-12 text-center rounded-3xl border-2 border-dashed border-emerald-300">
                            <span className="text-6xl block mb-3">🪴</span>
                            <h3 className="text-2xl font-black text-emerald-800 mb-2">아직 식물이 없어요!</h3>
                            <p className="font-extrabold text-slate-600 text-lg mb-6">새 식물을 등록하거나 사진으로 식물 이름을 찾아 추가해 보세요.</p>
                            <button onClick={openAddModal} className="kid-btn px-6 py-3 bg-emerald-500 text-white font-black text-lg rounded-2xl shadow-md">첫 식물 추가하기 ✨</button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {myPlants.map(plant => {
                                const ws = calculateWaterStatus(plant.lastWatered, plant.waterIntervalDays);
                                return (
                                    <div key={plant.id} className="kid-card bg-white border-2 border-emerald-200 overflow-hidden flex flex-col justify-between">
                                        <div>
                                            <div className="relative h-56 bg-slate-100 overflow-hidden">
                                                <PlantPic plant={plant} className="w-full h-full object-cover" />
                                                <span className={`absolute top-3 left-3 px-3 py-1 rounded-full font-black text-sm shadow-md ${ws.colorClass}`}>{ws.statusText}</span>
                                                {plant.sample && <span className="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-white/90 text-slate-600 font-black text-xs">예시 식물</span>}
                                                {analyzingCardId === plant.id && (
                                                    <div className="absolute inset-0 bg-white/80 flex items-center justify-center gap-2 font-black text-emerald-700">
                                                        <i className="fa-solid fa-spinner fa-spin"></i><span>AI가 사진을 보는 중...</span>
                                                    </div>
                                                )}
                                                <label className="absolute bottom-3 right-3 bg-white/90 hover:bg-white text-emerald-800 px-3 py-1.5 rounded-xl font-extrabold text-xs shadow-md cursor-pointer flex items-center gap-1.5">
                                                    <i className="fa-solid fa-camera"></i><span>사진 바꾸기</span>
                                                    <input type="file" accept="image/*" className="sr-only" onChange={(e) => handleExistingCardPhotoChange(e, plant.id)} />
                                                </label>
                                            </div>
                                            <div className="p-5">
                                                <div className="flex items-start justify-between gap-2 mb-2">
                                                    <div className="min-w-0">
                                                        <h3 className="text-2xl font-black text-slate-800 leading-tight break-words">{plant.nickname}</h3>
                                                        <p className="text-sm font-extrabold text-emerald-600 mt-0.5">품종: {plant.species}</p>
                                                    </div>
                                                    <button onClick={() => setDeleteTarget(plant)} className="text-slate-400 hover:text-red-500 p-2 text-lg" aria-label={`${plant.nickname} 삭제`}>
                                                        <i className="fa-solid fa-trash-can"></i>
                                                    </button>
                                                </div>
                                                <div className="bg-emerald-50 p-3 rounded-2xl border border-emerald-100 mb-4 text-sm font-bold text-slate-700 space-y-1">
                                                    <div className="flex justify-between"><span className="text-slate-500">마지막 물 준 날:</span><span className="font-extrabold text-emerald-800 tabular-nums">{plant.lastWatered || '기록 없음'}</span></div>
                                                    <div className="flex justify-between"><span className="text-slate-500">물주기 주기:</span><span className="font-extrabold text-emerald-800">{plant.waterIntervalDays}일마다</span></div>
                                                </div>
                                                <p className="text-sm font-extrabold text-slate-600 bg-amber-50 p-3 rounded-2xl border border-amber-200 leading-relaxed">📝 {plant.memo}</p>
                                            </div>
                                        </div>
                                        <div className="p-5 pt-0">
                                            <button onClick={() => handleWaterPlant(plant.id)} className="kid-btn w-full py-3.5 bg-blue-500 hover:bg-blue-600 text-white font-black text-lg rounded-2xl shadow-md flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-droplet text-yellow-300"></i><span>지금 물 주기 (시원해!)</span>
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            )}

            {/* 식물 이름 찾기 */}
            {activeTab === 'identify' && (
                <div className="bg-white p-6 md:p-8 rounded-3xl border-3 border-emerald-300 shadow-md space-y-6">
                    <div>
                        <h2 className="text-2xl md:text-3xl font-extrabold text-emerald-900">📸 AI 사진으로 식물 이름 찾기</h2>
                        <p className="text-base md:text-lg font-bold text-slate-600 mt-1">길가나 집에서 발견한 궁금한 식물 사진을 올려 보세요! AI가 이름을 찾아 줘요.</p>
                    </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-4">
                            <label className="border-3 border-dashed border-emerald-300 bg-emerald-50 rounded-3xl p-6 text-center min-h-[280px] flex flex-col items-center justify-center cursor-pointer">
                                {identifyImage ? (
                                    <img src={identifyImage} alt="올린 식물 사진" className="max-h-64 object-contain rounded-2xl shadow-sm" />
                                ) : (
                                    <div className="space-y-3">
                                        <div className="w-20 h-20 bg-emerald-100 rounded-3xl flex items-center justify-center mx-auto text-emerald-600 text-4xl"><i className="fa-solid fa-cloud-arrow-up"></i></div>
                                        <p className="font-black text-slate-700 text-lg">이곳을 눌러 식물 사진을 올려주세요</p>

                                    </div>
                                )}
                                <input type="file" accept="image/*" onChange={handleIdentifyUpload} className="sr-only" />
                            </label>
                            <button onClick={runPlantIdentification} disabled={isIdentifying || !identifyImage}
                                className={`kid-btn w-full py-4 text-white font-black text-xl rounded-2xl shadow-md flex items-center justify-center gap-2 ${isIdentifying || !identifyImage ? 'bg-slate-300 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                                {isIdentifying ? <><i className="fa-solid fa-spinner fa-spin"></i><span>AI가 식물을 찾아보는 중...</span></>
                                    : <><i className="fa-solid fa-wand-magic-sparkles"></i><span>식물 탐험 분석 시작!</span></>}
                            </button>
                        </div>
                        <div>
                            {identifyResult ? (
                                <div className="bg-emerald-50 border-2 border-emerald-300 p-6 rounded-3xl space-y-4">
                                    <div className="border-b border-emerald-200 pb-3">
                                        <span className="text-xs font-black bg-emerald-200 text-emerald-800 px-2.5 py-0.5 rounded-full">{identifyResult.category || '식물 도감'}</span>
                                        <h3 className="text-3xl font-black text-emerald-900 mt-1">{identifyResult.plantName}</h3>
                                        <p className="text-xs font-bold text-slate-500">{identifyResult.englishName}</p>
                                    </div>
                                    {identifyResult.safety && (
                                        <div className="bg-red-50 border-2 border-red-300 rounded-2xl p-3 text-sm font-black text-red-800">⚠️ {identifyResult.safety}</div>
                                    )}
                                    <div>
                                        <h4 className="font-black text-slate-800 text-base mb-1">🌿 식물의 주요 특징</h4>
                                        <ul className="list-disc list-inside space-y-1 text-sm font-bold text-slate-700">
                                            {(identifyResult.features || []).map((f, i) => <li key={i}>{f}</li>)}
                                        </ul>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm font-extrabold">
                                        <div className="bg-white p-3 rounded-2xl border border-emerald-200"><span className="text-emerald-700 block mb-0.5">☀️ 햇빛</span><span className="text-slate-800">{identifyResult.sunlight}</span></div>
                                        <div className="bg-white p-3 rounded-2xl border border-emerald-200"><span className="text-blue-600 block mb-0.5">💧 물주기</span><span className="text-slate-800">{identifyResult.waterGuide}</span></div>
                                    </div>
                                    <div className="bg-amber-100 p-3.5 rounded-2xl border border-amber-300">
                                        <span className="font-black text-amber-900 text-sm block">💡 재미있는 사실:</span>
                                        <p className="text-sm font-bold text-amber-950 mt-0.5">{identifyResult.funFact}</p>
                                    </div>
                                    <button onClick={handleAddIdentifiedToMyGarden} className="kid-btn w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-black text-lg rounded-2xl shadow-md flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-heart"></i><span>내 식물밭에 등록하기</span>
                                    </button>
                                </div>
                            ) : (
                                <div className="h-full min-h-[280px] bg-slate-50 rounded-3xl border-2 border-slate-200 p-6 flex flex-col items-center justify-center text-center space-y-2">
                                    <i className="fa-solid fa-seedling text-5xl text-slate-300"></i>
                                    <p className="font-black text-slate-500 text-lg">분석 결과가 여기에 나타나요!</p>
                                    <p className="text-xs font-bold text-slate-400">왼쪽에서 사진을 올려서 AI 탐험을 시작해 보세요.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            )}

            {/* 화분 건강 진단 */}
            {activeTab === 'diagnosis' && (
                <div className="bg-white p-6 md:p-8 rounded-3xl border-3 border-emerald-300 shadow-md space-y-6">
                    <div>
                        <h2 className="text-2xl md:text-3xl font-extrabold text-emerald-900">🩺 AI 화분 의사 선생님 진단실</h2>
                        <p className="text-base md:text-lg font-bold text-slate-600 mt-1">시든 잎이나 노란 잎, 화분 사진을 올려 주세요! 어디가 아픈지 알려 줄게요.</p>
                    </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-4">
                            <label className="border-3 border-dashed border-rose-300 bg-rose-50 rounded-3xl p-6 text-center min-h-[280px] flex flex-col items-center justify-center cursor-pointer">
                                {diagnosisImage ? (
                                    <img src={diagnosisImage} alt="진단할 식물 사진" className="max-h-64 object-contain rounded-2xl shadow-sm" />
                                ) : (
                                    <div className="space-y-3">
                                        <div className="w-20 h-20 bg-rose-100 rounded-3xl flex items-center justify-center mx-auto text-rose-500 text-4xl"><i className="fa-solid fa-stethoscope"></i></div>
                                        <p className="font-black text-slate-700 text-lg">아프거나 걱정되는 잎/화분 사진 올리기</p>
                                        <p className="text-xs font-bold text-slate-500">선명하게 찍을수록 정확해요!</p>
                                    </div>
                                )}
                                <input type="file" accept="image/*" onChange={handleDiagnosisUpload} className="sr-only" />
                            </label>
                            <button onClick={runPlantDiagnosis} disabled={isDiagnosing || !diagnosisImage}
                                className={`kid-btn w-full py-4 text-white font-black text-xl rounded-2xl shadow-md flex items-center justify-center gap-2 ${isDiagnosing || !diagnosisImage ? 'bg-slate-300 cursor-not-allowed' : 'bg-rose-500 hover:bg-rose-600'}`}>
                                {isDiagnosing ? <><i className="fa-solid fa-spinner fa-spin"></i><span>의사 선생님이 진찰 중이에요...</span></>
                                    : <><i className="fa-solid fa-heart-pulse"></i><span>건강 상태 진단하기</span></>}
                            </button>
                        </div>
                        <div>
                            {diagnosisResult ? (
                                <div className="bg-rose-50 border-2 border-rose-300 p-6 rounded-3xl space-y-4">
                                    <div className="flex items-center gap-3 border-b border-rose-200 pb-3">
                                        <span className="text-4xl">{diagnosisResult.statusEmoji || '🩺'}</span>
                                        <div>
                                            <span className="text-xs font-black bg-rose-200 text-rose-900 px-2.5 py-0.5 rounded-full">{diagnosisResult.healthStatus || '진단 결과'}</span>
                                            <h3 className="text-2xl font-black text-rose-950 mt-1">{diagnosisResult.diagnosisTitle}</h3>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="font-black text-slate-800 text-base mb-1">🔍 관찰된 증상</h4>
                                        <ul className="list-disc list-inside space-y-1 text-sm font-bold text-slate-700">
                                            {(diagnosisResult.symptoms || []).map((s, i) => <li key={i}>{s}</li>)}
                                        </ul>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl border border-rose-200 space-y-2">
                                        <h4 className="font-black text-emerald-800 text-base"><i className="fa-solid fa-kit-medical text-emerald-600"></i> 의사 선생님의 처방법</h4>
                                        <ol className="list-decimal list-inside space-y-1 text-sm font-extrabold text-slate-800">
                                            {(diagnosisResult.prescription || []).map((rx, i) => <li key={i}>{rx}</li>)}
                                        </ol>
                                    </div>
                                    <div className="bg-emerald-100 p-3.5 rounded-2xl border border-emerald-300 text-center">
                                        <p className="text-sm font-black text-emerald-900">💌 "{diagnosisResult.encouragement}"</p>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full min-h-[280px] bg-slate-50 rounded-3xl border-2 border-slate-200 p-6 flex flex-col items-center justify-center text-center space-y-2">
                                    <i className="fa-solid fa-user-doctor text-5xl text-slate-300"></i>
                                    <p className="font-black text-slate-500 text-lg">진단 처방전이 여기에 보여요!</p>
                                    <p className="text-xs font-bold text-slate-400">아픈 잎 사진을 올리고 진단 버튼을 눌러 보세요.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            )}

            {/* 식물 박사에게 질문 */}
            {activeTab === 'ask' && (
                <div className="bg-white p-6 md:p-8 rounded-3xl border-3 border-emerald-300 shadow-md space-y-5">
                    <div>
                        <h2 className="text-2xl md:text-3xl font-extrabold text-emerald-900">🦉 식물 박사에게 물어보기</h2>
                        <p className="text-base md:text-lg font-bold text-slate-600 mt-1">식물에 대해 궁금한 건 뭐든지 물어보세요!</p>
                    </div>
                                        <div className="bg-emerald-50 rounded-3xl border-2 border-emerald-200 p-4 min-h-[240px] max-h-[420px] overflow-y-auto space-y-3" aria-live="polite">
                        {chat.length === 0 ? (
                            <div className="space-y-2">
                                <p className="font-black text-emerald-800">이런 걸 물어볼 수 있어요 👇</p>
                                {['선인장은 왜 가시가 있어요?', '잎이 노랗게 변하면 어떻게 해요?', '해바라기는 정말 해를 따라 돌아요?'].map(q => (
                                    <button key={q} onClick={() => setChatInput(q)} className="block text-left bg-white border border-emerald-300 rounded-2xl px-4 py-2 font-bold text-slate-700 hover:bg-emerald-100">{q}</button>
                                ))}
                            </div>
                        ) : chat.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] px-4 py-2.5 rounded-2xl font-bold whitespace-pre-wrap break-words ${m.role === 'user' ? 'bg-emerald-600 text-white' : 'bg-white border border-emerald-200 text-slate-800'}`}>
                                    {m.role === 'assistant' && <span className="mr-1">🦉</span>}
                                    {m.content || <span className="text-slate-400">생각하는 중...</span>}
                                </div>
                            </div>
                        ))}
                    </div>
                    <form onSubmit={sendChat} className="flex gap-2">
                        <label htmlFor="chat-input" className="sr-only">질문</label>
                        <input id="chat-input" type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} maxLength={300}
                            placeholder="예: 몬스테라 잎에 왜 구멍이 있어요?"
                            className="flex-1 min-w-0 px-4 py-3 border-2 border-emerald-200 rounded-2xl font-extrabold focus:outline-none" />
                        <button type="submit" disabled={chatBusy || !chatInput.trim()} className={`kid-btn px-5 py-3 text-white font-black rounded-2xl shadow-md shrink-0 ${chatBusy || !chatInput.trim() ? 'bg-slate-300' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                            {chatBusy ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-paper-plane"></i>} 묻기
                        </button>
                    </form>
                </div>
            )}

            {/* 날씨 상식 */}
            {activeTab === 'weather' && (
                <div className="bg-white p-6 md:p-8 rounded-3xl border-3 border-emerald-300 shadow-md space-y-6">
                    <div>
                        <h2 className="text-2xl md:text-3xl font-extrabold text-emerald-900">🌤️ 날씨 & 계절별 식물 키우기 상식</h2>
                        <p className="text-base md:text-lg font-bold text-slate-600 mt-1">날씨가 바뀌면 식물을 어떻게 돌봐야 할까요?</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-amber-50 p-5 rounded-3xl border-2 border-amber-200 space-y-2">
                            <div className="text-3xl">☀️</div>
                            <h3 className="text-xl font-black text-amber-900">햇빛 쨍쨍한 날</h3>
                            <p className="text-sm font-extrabold text-slate-700 leading-relaxed">화분 흙이 빨리 말라요. 아침 일찍이나 저녁에 물을 듬뿍 주고, 낮에는 뜨거운 햇볕을 살짝 피해 주세요.</p>
                        </div>
                        <div className="bg-blue-50 p-5 rounded-3xl border-2 border-blue-200 space-y-2">
                            <div className="text-3xl">🌧️</div>
                            <h3 className="text-xl font-black text-blue-900">비 오고 습한 날</h3>
                            <p className="text-sm font-extrabold text-slate-700 leading-relaxed">흙이 잘 마르지 않아요. 물주기를 며칠 미루고, 바람이 잘 통하게 해 주세요.</p>
                        </div>
                        <div className="bg-cyan-50 p-5 rounded-3xl border-2 border-cyan-200 space-y-2">
                            <div className="text-3xl">❄️</div>
                            <h3 className="text-xl font-black text-cyan-900">추운 겨울</h3>
                            <p className="text-sm font-extrabold text-slate-700 leading-relaxed">식물도 추위를 타요! 베란다 화분은 따뜻한 방으로 들이고, 미지근한 물을 주세요.</p>
                        </div>
                    </div>
                    <div className="bg-emerald-50 p-6 rounded-3xl border-2 border-emerald-300 space-y-3">
                        <h4 className="text-xl font-black text-emerald-900">📅 사계절 식물 달력</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {SEASON_TIPS.map(s => (
                                <div key={s.name} className={`p-4 rounded-2xl border-2 ${s === season ? 'bg-white border-emerald-500' : 'bg-white/60 border-emerald-200'}`}>
                                    <p className="font-black text-emerald-800">{s.name} <span className="text-xs text-slate-500">({s.months.join('·')}월)</span>{s === season && <span className="ml-2 text-xs bg-emerald-600 text-white px-2 py-0.5 rounded-full">지금</span>}</p>
                                    <p className="text-sm font-bold text-slate-700 mt-1">{s.tip}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}

            {/* 토스트 */}
            {toastMessage && (
                <div role="status" className="fixed left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-6 py-3.5 rounded-2xl font-black text-base shadow-2xl z-50 max-w-[90vw] text-center"
                    style={{ bottom: 'calc(24px + env(safe-area-inset-bottom, 0px))' }}>
                    {toastMessage}
                </div>
            )}

            {/* 식물 추가 모달 */}
            {showAddModal && (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-40" role="dialog" aria-modal="true" aria-labelledby="add-title">
                    <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full max-h-[90vh] overflow-y-auto border-4 border-emerald-400 shadow-2xl space-y-5">
                        <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                            <h3 id="add-title" className="text-2xl font-black text-emerald-900">🪴 새 식물 친구 등록하기</h3>
                            <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600 text-3xl font-bold leading-none" aria-label="닫기">&times;</button>
                        </div>
                        <form onSubmit={handleSaveNewPlantModal} className="space-y-4">
                            <div>
                                <p className="block text-sm font-black text-slate-700 mb-1">📸 식물 사진 (사진을 올리면 AI가 정보를 채워 줘요!)</p>
                                <label className="block border-2 border-dashed border-emerald-300 rounded-2xl p-4 text-center bg-emerald-50 relative cursor-pointer hover:bg-emerald-100">
                                    {modalImagePreview ? (
                                        <div className="relative">
                                            <img src={modalImagePreview} alt="미리보기" className="h-40 object-contain mx-auto rounded-xl" />
                                            {isAnalyzingModalImage && (
                                                <div className="absolute inset-0 bg-white/80 flex items-center justify-center font-black text-emerald-700 text-sm gap-2">
                                                    <i className="fa-solid fa-spinner fa-spin"></i><span>AI 사진 분석 중...</span>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="py-4 text-slate-500 font-bold text-sm">
                                            <i className="fa-solid fa-camera text-2xl text-emerald-500 block mb-1"></i>
                                            <span>사진을 찍거나 올려 보세요</span>
                                        </div>
                                    )}
                                    <input id="add-photo" type="file" accept="image/*" onChange={handleModalImageSelect} className="sr-only" />
                                </label>
                            </div>
                            <div>
                                <label htmlFor="add-nickname" className="block text-sm font-black text-slate-700 mb-1">💚 식물 별명 (예: 초록이, 싱싱이)</label>
                                <input id="add-nickname" type="text" required maxLength={20} placeholder="내가 붙여 준 예쁜 이름" value={newPlantData.nickname}
                                    onChange={(e) => setNewPlantData({ ...newPlantData, nickname: e.target.value })}
                                    className="w-full px-4 py-3 border-2 border-emerald-200 rounded-2xl font-extrabold focus:outline-none" />
                            </div>
                            <div>
                                <label htmlFor="add-species" className="block text-sm font-black text-slate-700 mb-1">🌿 식물 종류 (예: 몬스테라, 스투키, 다육이)</label>
                                <input id="add-species" type="text" required maxLength={30} placeholder="식물 종류 이름" value={newPlantData.species}
                                    onChange={(e) => setNewPlantData({ ...newPlantData, species: e.target.value })}
                                    className="w-full px-4 py-3 border-2 border-emerald-200 rounded-2xl font-extrabold focus:outline-none" />
                            </div>
                            <div>
                                <label htmlFor="add-interval" className="block text-sm font-black text-slate-700 mb-1">💧 물 주는 간격 ({newPlantData.waterIntervalDays}일마다)</label>
                                <input id="add-interval" type="range" min="1" max="30" value={newPlantData.waterIntervalDays}
                                    onChange={(e) => setNewPlantData({ ...newPlantData, waterIntervalDays: Number(e.target.value) })}
                                    className="w-full accent-emerald-600" />
                                <div className="flex justify-between text-xs font-bold text-slate-500"><span>매일 (물 좋아함)</span><span>한 달에 한 번 (선인장)</span></div>
                            </div>
                            <div>
                                <label htmlFor="add-memo" className="block text-sm font-black text-slate-700 mb-1">📝 메모 / 다짐</label>
                                <textarea id="add-memo" maxLength={100} placeholder="예: 창가 햇빛이 잘 드는 곳에 둠!" value={newPlantData.memo}
                                    onChange={(e) => setNewPlantData({ ...newPlantData, memo: e.target.value })}
                                    className="w-full px-4 py-3 border-2 border-emerald-200 rounded-2xl font-extrabold focus:outline-none h-20 resize-none"></textarea>
                            </div>
                            <div className="flex justify-end gap-3 pt-2">
                                <button type="button" onClick={() => setShowAddModal(false)} className="px-5 py-3 rounded-2xl font-black text-slate-600 bg-slate-100 hover:bg-slate-200">취소</button>
                                <button type="submit" disabled={isAnalyzingModalImage} className="kid-btn px-6 py-3 bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-300 text-white font-black rounded-2xl shadow-md">식물 등록 저장 🌟</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {/* 삭제 확인 */}
            {deleteTarget && (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-40" role="dialog" aria-modal="true">
                    <div className="bg-white rounded-3xl p-6 max-w-sm w-full border-4 border-rose-300 shadow-2xl text-center space-y-4">
                        <div className="text-5xl">🗑️</div>
                        <h3 className="text-2xl font-black text-slate-800">'{deleteTarget.nickname}'</h3>
                        <p className="font-extrabold text-slate-600 text-base">정말로 이 식물 친구를 내 식물밭에서 보낼까요?</p>
                        <div className="flex justify-center gap-3 pt-2">
                            <button onClick={() => setDeleteTarget(null)} className="px-4 py-3 rounded-2xl font-black text-slate-600 bg-slate-100 hover:bg-slate-200 flex-1">아니요</button>
                            <button onClick={confirmDeletePlant} className="kid-btn px-4 py-3 rounded-2xl font-black text-white bg-rose-500 hover:bg-rose-600 shadow-md flex-1">네, 지울게요</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
